name: AI PR Review
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: jhossepmartinez/pr-reviewer@main
        with:
          deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
